[tool.poetry]
name = "falling-sand-game"
version = "0.1.0"
description = "Falling Sand Game with Pygame"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
pygame-ce = "^2.5.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)"
]
